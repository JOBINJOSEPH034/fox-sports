{% extends 'base1.html' %}

{% block title %}Order History{% endblock %}

{% block content %}
<div class="bg-light p-4">
    <h3>Order History</h3>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Status</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            <tr>
                <td>{{ order.id }}</td>
                <td>{{ order.created_at }}</td>
                <td>{{ order.status }}</td>
                <td>₹{{ order.total_price }}</td>
                <td>
                    <a href="{% url 'cancel_order' order.id %}" class="btn btn-sm btn-danger" {% if order.status == "Delivered" %}disabled{% endif %}>
                        Cancel Order
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
