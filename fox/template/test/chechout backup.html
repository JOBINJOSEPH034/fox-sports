{% extends 'base.html' %}
{% load static %}
{% block body %}




<div class="page-wrapper">
   <div class="content container-fluid">
       <div class="page-header">
           <div class="row align-items-center">
               <div class="col">
                   <h3 class="page-title">Add Product</h3>
                   <ul class="breadcrumb">
                       <li class="breadcrumb-item"><a href="{% url 'product' %}">Product</a></li>
                       <li class="breadcrumb-item active">Add Product</li>
                   </ul>
               </div>
           </div>
       </div>

       <div class="row">
           <div class="col-md-8 offset-md-2">
               <div class="card">
                   <div class="card-header bg-primary text-white">
                       <h4 class="card-title">Add Product Details</h4>
                   </div>
                   <div class="card-body">
                       <form method="POST" enctype="multipart/form-data">
                           {% csrf_token %}
                           
                           <!-- Product Information -->
                           <h5 class="text-secondary mb-3">Product Details</h5>
                           <div class="form-row">
                               <div class="form-group col-md-6">
                                   <label for="name">Product Name</label>
                                   <input type="text" class="form-control" id="name" name="name" placeholder="Enter product name" required>
                               </div>
                               <div class="form-group col-md-6">
                                 <label for="id_category">Category</label>
                                 <select name="category" id="id_category" class="form-control">
                                     <option value="">Select a Category</option>
                                     {% for category in categories %}
                                         <option value="{{ category.id }}">{{ category.name }}</option>
                                     {% endfor %}
                                 </select>
                             </div>
                             
                           </div>
                           <div class="form-group">
                               <label for="description">Description</label>
                               <textarea class="form-control" id="description" name="description" rows="3" placeholder="Enter product description"></textarea>
                           </div>
                           <!-- Add Product Form -->
                              <div class="form-group col-md-6">
                              <label for="id_brand">Brand</label>
                               {{ product_form.brand }}
                              </div>

                           
                           <div class="form-row">
                               <div class="form-group col-md-6">
                                   <label for="price">Price</label>
                                   <input type="number" class="form-control" id="price" name="price" placeholder="Enter product price" required>
                               </div>
                               <div class="form-group col-md-6">
                                   <label for="stock">Total Stock</label>
                                   <input type="number" class="form-control" id="stock" name="stock" placeholder="Enter total stock" required>
                               </div>
                           </div>
                           <div class="form-row">
                               <div class="form-group col-md-6">
                                   <label for="image1">Product Image 1</label>
                                   <input type="file" class="form-control-file" id="image1" name="image1" required>
                               </div>
                               <div class="form-group col-md-6">
                                   <label for="image2">Product Image 2</label>
                                   <input type="file" class="form-control-file" id="image2" name="image2">
                               </div>
                           </div>

                           <!-- Product Variants -->
                           <h5 class="text-secondary mb-3">Product Variants</h5>
                           <div id="variant-container">
                               <!-- Variants will be added dynamically -->
                           </div>
                           <button type="button" id="add-variant-btn" class="btn btn-outline-primary btn-sm mt-2">
                               <i class="fas fa-plus"></i> Add Variant
                           </button>

                           <hr>
                           <button type="submit" class="btn btn-success btn-block">Save Product</button>
                       </form>
                   </div>
               </div>
           </div>
       </div>
   </div>
</div>

<!-- Include necessary Bootstrap CSS and JS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
   let variantIndex = 0;
   const variantContainer = document.getElementById("variant-container");
   const addVariantBtn = document.getElementById("add-variant-btn");

   addVariantBtn.addEventListener("click", function () {
       const variantTemplate = `
           <div class="variant-item" id="variant-${variantIndex}">
               <h5>Variant ${variantIndex + 1}</h5>
               <div class="form-group">
                   <label>Size</label>
                   <input type="text" name="variants[${variantIndex}][size]" class="form-control" required>
               </div>
               <div class="form-group">
                   <label>Color</label>
                   <input type="text" name="variants[${variantIndex}][color]" class="form-control" required>
               </div>
               <div class="form-group">
                   <label>Additional Price</label>
                   <input type="number" name="variants[${variantIndex}][additional_price]" class="form-control" required>
               </div>
               <div class="form-group">
                   <label>Stock</label>
                   <input type="number" name="variants[${variantIndex}][stock]" class="form-control" required>
               </div>
               <button type="button" class="btn btn-danger remove-variant-btn" data-id="variant-${variantIndex}">
                   Remove
               </button>
               <hr>
           </div>`;
       variantContainer.insertAdjacentHTML("beforeend", variantTemplate);

       // Add remove button functionality
       document.querySelectorAll(".remove-variant-btn").forEach(function (btn) {
           btn.addEventListener("click", function () {
               const variantId = btn.getAttribute("data-id");
               document.getElementById(variantId).remove();
           });
       });

       variantIndex++;
   });
});
</script>

<script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>
<script src="{% static 'assets/js/popper.min.js' %}"></script>
<script src="{% static 'assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>
<script src="{% static 'assets/plugins/slimscroll/jquery.slimscroll.min.js' %}"></script>
<script src="{% static 'assets/js/script.js' %}"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" />

<!-- Cropper.js JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>

{% endblock %}
