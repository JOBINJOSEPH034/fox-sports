{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href=""/>
    <link rel="stylesheet" type="text/css" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'fonts/font-awesome-4.7.0/css/font-awesome.min.css' %}">
    <style>
        /* Ensure body and html take full height */
        html, body {
            height: 100%;
        }
        /* Centering with Flexbox */
        .centered-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Full height of the viewport */
        }
    </style>
    <style>
        .custom-form {
            max-width: 500px; /* Adjust the width of the form */
            margin: 0 auto; /* Center the form horizontally */
            padding: 20px; /* Add padding inside the form */
            border: 1px solid #ccc; /* Optional: Add a border around the form */
            border-radius: 8px; /* Optional: Round the corners */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: Add a subtle shadow */
            background-color: #f9f9f9; /* Optional: Add a background color */
        }
    
        .custom-form .form-group {
            margin-bottom: 15px; /* Add space between form fields */
        }
    
        .custom-form input {
            width: 100%; /* Make input fields responsive */
            padding: 10px; /* Add padding inside input fields */
            font-size: 14px; /* Adjust the font size */
            border: 1px solid #ddd; /* Add a border to input fields */
            border-radius: 4px; /* Round the edges of input fields */
        }
    
        .custom-form button {
            width: 100%; /* Make the button span the form's width */
            padding: 10px; /* Add padding inside the button */
            font-size: 16px; /* Adjust button font size */
            background-color: #343a40; /* Button background color */
            color: #fff; /* Button text color */
            border: none; /* Remove button border */
            border-radius: 4px; /* Round the button edges */
            cursor: pointer; /* Show pointer on hover */
        }
    
        .custom-form button:hover {
            background-color: #495057; /* Darken the button color on hover */
        }
    
        @media (max-width: 576px) {
            .custom-form {
                padding: 15px; /* Reduce padding on smaller screens */
                font-size: 12px; /* Adjust font size for mobile */
            }
    
            .custom-form input,
            .custom-form button {
                font-size: 14px; /* Adjust input and button font size */
            }
        }
    </style>
     <link href="{% static 'css/msg.css' %}" rel="stylesheet">
    
</head>
{% if messages %}
<div class="messages">
    {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<body class="bg-light">
    <div class="container centered-container">
        <div class="w-100">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-5">
                            <!-- Logo -->
                           
                            <!-- Sign Up Form -->
                            <form method="post" action="{% url 'signup' %}" class="custom-form">
                                {% csrf_token %}

                                <div class="form-group">
                                    <label for="first_name">First Name</label>
                                    <input type="text" class="form-control form-control-lg" id="first_name" name="first_name" value="{{first_name}}" required>
                                </div>

                                <div class="form-group">
                                    <label for="last_name">Last Name</label>
                                    <input type="text" class="form-control form-control-lg" id="last_name" name="last_name" value="{{last_name}}" required>
                                </div>


                                <div class="form-group">
                                    <label for="username">User Name</label>
                                    <input type="text" class="form-control form-control-lg" id="username" name="username" value="{{user_name}}" required>
                                </div>

                                

                                <div class="form-group">
                                    <label for="email">Email address</label>
                                    <input type="email" class="form-control form-control-lg" id="email" name="email" value="{{email}}" required>
                                </div>

                                <div class="form-group">
                                    <label for="referral_code">Referral Code (Optional)</label>
                                    <input type="text" class="form-control form-control-lg" id="referral_code" name="referral_code" placeholder="Enter referral code (if any)">
                                </div>
                                

                
                                <div class="form-group">
                                    <label for="password">Password</label>
                                    <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                                </div>

                                <div class="form-group">
                                    <label for="confirm_password">Confirm Password</label>
                                    <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" required>
                                </div>
                                {% if errors %}
                                <div class="alert alert-danger">
                                    <ul>
                                        {% for error in errors %}
                                            <li>{{ error }}</li>
                                        {% endfor %}
                                    </ul>
                                </div>
                                {% endif %}
                                <button type="submit" class="btn btn-dark btn-block btn-lg mb-4">SIGN UP</button>

                                <!-- Footer Links -->
                                <div class="text-center">
                                    <p class="mb-0">Already have an account? <a href="{% url 'login' %}" class="text-dark font-weight-bold">Login</a></p>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
 <script>
    // Check if signup success is passed as context
    
</script>
{% if account_exists %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        Swal.fire({
            title: 'Account exists!',
            text: 'An account with this email ID already exists.',
            icon: 'error',
            confirmButtonText: 'OK'
        }).then(() => {
            window.location.href = "{% url 'auth_home:login' %}";
        });
    });
</script>
{% endif %}


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="{% static 'vendor/jquery/jquery-3.2.1.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.min.js' %}"></script>
</body>
</html>
