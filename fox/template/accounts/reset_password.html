{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Enter OTP</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href=""/>
    <link rel="stylesheet" type="text/css" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'fonts/font-awesome-4.7.0/css/font-awesome.min.css' %}">
    <style>
        html, body {
            height: 100%;
        }
        .centered-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .timer {
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: bold;
        }
        .resend-link {
            color: #212529;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }
        .resend-link.disabled {
            opacity: 0.5;
            pointer-events: none;
            cursor: default;
        }
    </style>
</head>
{% if messages %}
<div class="messages">
    {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
<body class="bg-light">
    <div class="container centered-container">
        <div class="w-100">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-5">
                            <!-- Logo -->
                            

                            <!-- OTP Form -->
                            <form method="POST">
                                {% csrf_token %}
                                
                               
                                <div class="form-group">
                                    <label for="password">Password</label>
                                    <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                                </div>

                                <div class="form-group">
                                    <label for="confirm_password">Confirm Password</label>
                                    <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" required>
                                </div>

                                <button type="submit" class="btn btn-dark btn-block btn-lg mb-4">RESET PASSWORD</button>

                                <!-- Resend OTP Link with Timer -->
                                <div class="text-center">
                                </form>
                                <p><a href="{% url 'login' %}">Back to Login</a></p>
                                
                                    {% if errors %}
                                    <div class="alert alert-danger mt-3">
                                        <ul class="mb-0">
                                            {% for error in errors %}
                                                <li>{{ error }}</li>
                                            {% endfor %}
                                        </ul>
                                    </div>
                                    {% endif %}
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'vendor/jquery/jquery-3.2.1.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.min.js' %}"></script>

    <script>
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            const timerDisplay = document.getElementById('timer');
            const resendLink = document.getElementById('resendLink');
            let timeLeft = 60; 

            timerDisplay.textContent = `Resend OTP available in ${formatTime(timeLeft)}`;

            const timerId = setInterval(() => {
                timeLeft -= 1;

                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerDisplay.style.display = 'none';
                    resendLink.classList.remove('disabled');
                } else {
                    timerDisplay.textContent = `Resend OTP available in ${formatTime(timeLeft)}`;
                }
            }, 1000);

            return timerId;
        }

        document.addEventListener('DOMContentLoaded', function() {
            startTimer();
        });

        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (password !== confirmPassword) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>

</body>
</html>
