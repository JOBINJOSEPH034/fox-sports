{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JoLetics{% endblock %}</title>

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/design-system.css' %}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 500px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            font-weight: 800;
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .auth-logo p {
            color: #666;
            font-size: 0.9rem;
        }

        .auth-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .auth-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .auth-card .subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-label {
            color: #1a1a1a;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .btn-primary-custom {
            background: #ff6b35;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            transition: all 0.3s;
        }

        .btn-primary-custom:hover {
            background: #ff5722;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-google {
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            color: #1a1a1a;
            transition: all 0.3s;
        }

        .btn-google:hover {
            border-color: #ff6b35;
            color: #1a1a1a;
            transform: translateY(-2px);
        }

        .divider {
            position: relative;
            text-align: center;
            margin: 25px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #e9ecef;
        }

        .divider span {
            position: relative;
            background: #fff;
            padding: 0 15px;
            color: #999;
            font-size: 0.85rem;
        }

        a {
            color: #ff6b35;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #ff5722;
        }

        .alert {
            background: #fff3f0;
            border: 1px solid #ffccc7;
            border-radius: 10px;
            color: #d32f2f;
            padding: 12px;
            font-size: 0.9rem;
        }

        @media (max-width: 576px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-logo">
            <h1>JOLETICS</h1>
            <p>Premium Athletic Gear</p>
        </div>

        {% include 'partials/_messages_partial.html' %}

        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
    {% include 'partials/_messages_partial.html' %}
</body>

</html>
