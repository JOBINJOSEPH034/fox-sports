{% extends 'auth_base.html' %}
{% load static %}

{% block title %}Verify OTP - JoLetics{% endblock %}

{% block content %}
<div class="auth-card text-center">

    <div class="otp-icon-wrap mb-3">
        <i class="fas fa-shield-alt" style="font-size: 2.5rem; color: #ff6b35;"></i>
    </div>

    <h2>Verify OTP</h2>
    <p class="subtitle">
        We've sent a 6-digit code to<br>
        <strong style="color:#1a1a1a;">{{ email }}</strong>
    </p>

    <form method="POST" action="?email={{ email }}">
        {% csrf_token %}

        <div class="mb-4">
            <input
                type="text"
                class="form-control"
                name="otp"
                maxlength="6"
                inputmode="numeric"
                pattern="\d{6}"
                placeholder="• • • • • •"
                style="letter-spacing: 18px; text-align: center; font-size: 26px; font-weight: 700; padding: 14px 10px;"
                required
                autofocus>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
            <i class="fas fa-check-circle me-2"></i>Verify & Proceed
        </button>
    </form>

    <div class="mt-3">
        <p style="color: #666; font-size: 0.9rem;">
            Didn't receive a code?
            <a href="{% url 'forgot_password' %}" style="font-weight: 600;">Resend OTP</a>
        </p>
        <p style="margin-top: 8px;">
            <a href="{% url 'login' %}" style="font-size: 0.85rem; color: #999;">← Back to Login</a>
        </p>
    </div>

</div>
{% endblock %}
