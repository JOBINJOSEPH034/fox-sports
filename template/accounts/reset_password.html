{% extends 'user_base.html' %}
{% load static %}

{% block title %}Reset Password - JoLetics{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        min-height: calc(100vh - 400px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card auth-card shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fas fa-lock fa-3x text-primary mb-3"></i>
                    <h2 class="fw-900 border-bottom d-inline-block pb-2 text-uppercase">Reset Password</h2>
                    <p class="text-muted small mt-2">Create a secure new password for your account.</p>
                </div>

                <form method="POST" action="">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="new_password" class="form-label small fw-bold text-uppercase">New Password</label>
                        <input type="password" class="form-control form-control-premium" id="new_password"
                            name="new_password" placeholder="At least 8 characters" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label small fw-bold text-uppercase">Confirm
                            Password</label>
                        <input type="password" class="form-control form-control-premium" id="confirm_password"
                            name="confirm_password" placeholder="Repeat new password" required>
                    </div>

                    <button type="submit" class="btn btn-premium w-100 mb-4">UPDATE PASSWORD</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
