{% extends 'auth_base.html' %}
{% load static %}

{% block title %}Login - JoLetics{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="text-center">
        <h2>Welcome Back</h2>
        <p class="subtitle">Join JoLetics today</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label for="name" class="form-label">Username</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your username" required>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label for="password" class="form-label mb-0">Password</label>
                <a href="{% url 'forgot_password' %}" style="font-size: 0.85rem;">Forgot Password?</a>
            </div>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password"
                required>
        </div>

        {% if error %}
        <div class="alert mb-3">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
            Sign In
        </button>


        <div class="text-center mt-4">
            <p class="mb-0" style="color: #666; font-size: 0.9rem;">
                Don't have an account?
                <a href="{% url 'signup' %}" style="font-weight: 600;">Create one</a>
            </p>
        </div>
    </form>
</div>
{% endblock %}
